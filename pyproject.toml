[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "overheating-warning"
version = "0.2.0"
description = "Non-activating Windows CPU temperature warnings for gaming laptops"
requires-python = ">=3.11"
dependencies = [
  "pywin32>=310; sys_platform == 'win32'",
  "pythonnet>=3.0.5; sys_platform == 'win32'",
]

[project.optional-dependencies]
build = ["pyinstaller>=6.16"]

[project.scripts]
overheating-warning = "overheating_warning.app:main"

[tool.setuptools.packages.find]
include = ["overheating_warning*"]
